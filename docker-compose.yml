services:
  postgres:
    image: postgres:17-alpine
    container_name: itmodd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itmodd}
      POSTGRES_USER: ${POSTGRES_USER:-itmodd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itmodd_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - itmodd-postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: itmodd-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - itmodd-pgadmin-data:/var/lib/pgadmin

volumes:
  itmodd-postgres-data:
  itmodd-pgadmin-data:
